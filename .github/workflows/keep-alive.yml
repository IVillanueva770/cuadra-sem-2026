name: keep-alive-demo

# Mantiene la demo de Cuadra viva y fresca sin intervención:
#  - Refresca los últimos 8 días de actividad (datos siempre terminan en "hoy").
#  - Esa escritura cuenta como actividad → Supabase no pausa el proyecto (pausa a los 7 días).
# Corre cada ~5 días (margen seguro bajo el límite de 7) y se puede disparar a mano.

on:
  schedule:
    - cron: '0 9 */5 * *' # cada ~5 días, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refrescar datos demo + keep-alive Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/seed-refresh.mjs 8
      - name: Marcar actividad en el repo (evita que GitHub desactive el cron a los 60 días de inactividad)
        run: |
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keep-alive $(date -u +%F)"
          git push -f origin keepalive
